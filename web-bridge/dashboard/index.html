<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캠페인 성과 대시보드</title>
<style>
  /* ── 팔레트 (dataviz 검증 완료: slots 1-3, light/dark) + MCE Bot 브랜드 그라데이션 ── */
  :root {
    color-scheme: light;
    --page:        #f6f7fa;
    --surface:     #ffffff;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,.08);
    --shadow:      0 1px 2px rgba(23,25,60,.04), 0 6px 20px rgba(23,25,60,.05);
    --grad:        linear-gradient(135deg, #0f2f6d 0%, #1d4ed8 55%, #2f7ae5 100%);
    --accent:      #1d4ed8;
    --s1:          #2a78d6;  /* 발송 (blue) */
    --s2:          #eb6834;  /* 오픈율 (orange) */
    --s3:          #1baf7a;  /* 클릭률 (aqua) */
    --good-text:   #006300;
    --good-bg:     rgba(12,163,12,.10);
    --bad-text:    #b3261e;
    --bad-bg:      rgba(208,59,59,.10);
    --st-warning:  #fab219;
    --st-serious:  #ec835a;
    --st-good:     #0ca30c;
  }
  /* 다크 테마 — OS 설정(미디어쿼리)과 수동 토글(data-theme)이 서로를 이길 수 있게 이중 선언 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,.09);
      --shadow:    0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --accent:    #5b9bf8;
      --s1:        #3987e5;
      --s2:        #d95926;
      --s3:        #199e70;
      --good-text: #0ca30c;
      --good-bg:   rgba(12,163,12,.16);
      --bad-text:  #e66767;
      --bad-bg:    rgba(230,103,103,.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,.09);
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --accent:    #5b9bf8;
    --s1:        #3987e5;
    --s2:        #d95926;
    --s3:        #199e70;
    --good-text: #0ca30c;
    --good-bg:   rgba(12,163,12,.16);
    --bad-text:  #e66767;
    --bad-bg:    rgba(230,103,103,.14);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { padding: 26px clamp(16px, 3vw, 40px) 56px; }

  /* ── 헤더 ── */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 22px; }
  .brand h1 { font-size: 21px; letter-spacing: -.4px; line-height: 1.25; }
  .brand .sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 999px; padding: 3px 12px; font-size: 11.5px; font-weight: 700;
    color: #8a5800; background: rgba(250,178,25,.16); border: 1px solid rgba(250,178,25,.35);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #fab219; } }
  :root[data-theme="dark"] .badge { color: #fab219; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  .chip {
    border: none; background: none; color: var(--ink-2);
    border-radius: 9px; padding: 5px 16px; font: inherit; font-size: 12.5px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { color: #fff; font-weight: 700; background: var(--grad); }
  .range {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px 10px; box-shadow: var(--shadow); color: var(--muted); font-size: 12.5px;
  }
  .range input {
    border: none; background: none; color: var(--ink-2); font: inherit; font-size: 12.5px;
    padding: 4px 2px; outline: none; font-variant-numeric: tabular-nums;
  }
  .range.active { border-color: var(--accent); }
  .range.active input { color: var(--ink); font-weight: 600; }
  .iconbtn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 12px; width: 36px; height: 36px; cursor: pointer; font-size: 15px;
    box-shadow: var(--shadow); display: grid; place-items: center;
  }
  .iconbtn:hover { color: var(--ink); }
  .minibtn {
    margin-left: auto; border: 1px solid var(--border); background: none; color: var(--ink-2);
    border-radius: 8px; padding: 3px 11px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .minibtn:hover { color: var(--ink); border-color: var(--accent); }

  /* ── 인쇄 / PDF 저장 ── */
  @media print {
    :root, :root[data-theme="dark"] {
      color-scheme: light;
      --page: #fff; --surface: #fff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,.15); --shadow: none;
    }
    .chips, .range, .iconbtn, .minibtn, .hint, .ins .act .copy, #tip { display: none !important; }
    body { background: #fff; }
    .wrap { padding: 0; }
    .card, .tile, .ins { box-shadow: none; break-inside: avoid; }
    .tiles { break-inside: avoid; }
  }

  /* ── 카드 공통 ── */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px; min-width: 0; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 13px; color: var(--ink-2); font-weight: 700; letter-spacing: -.1px; }
  .h2row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .h2row .hint { font-size: 11.5px; color: var(--muted); }
  .legend { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--ink-2); }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* ── 그리드 ── */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 16px; margin-bottom: 16px; }

  /* ── KPI 타일 ── */
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 17px; box-shadow: var(--shadow); }
  .tile .krow { display: flex; align-items: center; gap: 8px; }
  .tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .tile .delta {
    margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }
  .tile .delta.up   { color: var(--good-text); background: var(--good-bg); }
  .tile .delta.down { color: var(--bad-text);  background: var(--bad-bg); }
  .tile .delta.none { color: var(--muted); background: transparent; }
  .tile .v { font-size: 27px; font-weight: 700; letter-spacing: -.6px; margin: 3px 0 0; }

  svg { display: block; width: 100%; }
  svg text { font-family: inherit; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .endlab { font-size: 11.5px; fill: var(--ink-2); font-weight: 600; }

  /* ── 툴팁 ── */
  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 8px 12px; font-size: 12px; min-width: 138px;
  }
  #tip .t { color: var(--muted); margin-bottom: 4px; font-size: 11.5px; }
  #tip .r { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
  #tip .r b { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  #tip .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* ── 표 ── */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 8px 10px; text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--grid); font-size: 11.5px; white-space: nowrap; }
  th .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  td { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--page); }
  td:first-child { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

  /* ── 인사이트 카드 ── */
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
  .ins { border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; background: var(--page); position: relative; overflow: hidden; }
  .ins::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--lv); }
  .ins .lv {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    border-radius: 999px; padding: 2px 10px; margin-bottom: 8px;
    color: var(--ink); background: color-mix(in srgb, var(--lv) 16%, transparent);
  }
  .ins .lv::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lv); }
  .ins h3 { font-size: 13.5px; margin-bottom: 5px; line-height: 1.45; }
  .ins p { color: var(--ink-2); font-size: 12.5px; }
  .ins .act {
    display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px dashed var(--baseline); border-radius: 9px; padding: 7px 11px;
    cursor: pointer; transition: border-color .15s;
  }
  .ins .act:hover { border-color: var(--accent); color: var(--ink); }
  .ins .act .copy { margin-left: auto; font-size: 11px; color: var(--muted); flex: none; }

  .foot { margin-top: 24px; color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>캠페인 성과 대시보드</h1>
      <div class="sub" id="sub">불러오는 중…</div>
    </div>
    <span class="badge" id="srcBadge" hidden>⚠ 샘플 데이터</span>
    <span class="spacer"></span>
    <div class="chips" id="chips" role="group" aria-label="기간">
      <button class="chip" data-days="7">7일</button>
      <button class="chip" data-days="14" aria-pressed="true">14일</button>
      <button class="chip" data-days="30">30일</button>
    </div>
    <div class="range" id="range" aria-label="기간 직접 지정">
      <input type="date" id="dFrom"> <span>~</span> <input type="date" id="dTo">
    </div>
    <button class="iconbtn" id="themeBtn" title="라이트/다크 전환">🌙</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="row">
    <div class="card">
      <div class="h2row"><h2>일별 발송량</h2><span class="hint">막대에 마우스를 올리면 상세</span></div>
      <div id="barChart"></div>
    </div>
    <div class="card">
      <div class="h2row">
        <h2>일별 오픈율 · 클릭률</h2>
        <div class="legend">
          <span class="li"><span class="sw" style="background:var(--s2)"></span>오픈율</span>
          <span class="li"><span class="sw" style="background:var(--s3)"></span>클릭률</span>
        </div>
      </div>
      <div id="lineChart"></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="h2row"><h2>저니별 발송량</h2><span class="hint">기간 합계 · 발송량순</span></div>
      <div id="jBars"></div>
    </div>
    <div class="card">
      <div class="h2row"><h2>저니별 성과</h2><button class="minibtn" id="xlsxBtn">⬇ 엑셀</button></div>
      <div style="overflow-x:auto"><table id="jTable"></table></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="h2row"><h2>인사이트 · 다음 캠페인 제안</h2></div>
    <div class="insights" id="insights"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div id="tip"></div>

<script>
(async () => {
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
  const pct = (n) => (Math.round(n * 10) / 10).toFixed(1) + '%';
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

  let DATA;
  try {
    DATA = await (await fetch('/api/dashboard-data')).json();
  } catch {
    document.getElementById('sub').textContent = '데이터를 불러오지 못했습니다 — web-bridge 서버 상태를 확인하세요.';
    return;
  }
  const daily = DATA.daily || [];
  if (!daily.length) {
    document.getElementById('sub').textContent = '표시할 데이터가 없습니다.';
    return;
  }
  let period = { mode: 'preset', days: 14 };

  // 고객사별 테마 훅 — 데이터 JSON에 theme: { "accent": "#1d4ed8", "grad": "linear-gradient(...)", "page": "#..." } 를 넣으면
  // 같은 이름의 CSS 변수를 덮어쓴다. (--s1~--s3 시리즈 색을 바꿀 땐 dataviz 검증기 통과 색상만 사용할 것)
  for (const [k, v] of Object.entries(DATA.theme || {})) document.documentElement.style.setProperty('--' + k, String(v));

  document.getElementById('srcBadge').hidden = DATA.source !== 'sample';
  document.getElementById('foot').innerHTML =
    `<span>데이터 소스: ${DATA.source === 'sample' ? '샘플 (SENDLOG 적재 후 자동 전환)' : 'SENDLOG_History DE'}</span>` +
    `<span>생성 ${new Date(DATA.generatedAt).toLocaleString('ko-KR')}</span>` +
    `<span>MCE Bot · web-bridge</span>`;

  // ── 툴팁 ──
  const tip = document.getElementById('tip');
  function showTip(x, y, html) {
    tip.innerHTML = html;
    tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.max(y - r.height - 12, 8) + 'px';
  }
  const hideTip = () => (tip.style.display = 'none');
  const tipRow = (sw, label, val) =>
    `<div class="r"><span class="sw" style="background:${sw}"></span>${label}<b>${val}</b></div>`;

  const NS = 'http://www.w3.org/2000/svg';
  let uid = 0;
  const el = (tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const niceMax = (m) => {
    if (m <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(m)));
    for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= m) return k * p;
    return 10 * p;
  };
  // 라인 아래 은은한 영역 그라데이션 (18% → 0)
  function areaFill(svg, color) {
    const id = `g${++uid}`;
    const grad = el('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': color, 'stop-opacity': .18 }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': color, 'stop-opacity': 0 }));
    svg.appendChild(grad);
    return `url(#${id})`;
  }

  // 공통 차트 골격: 그리드·y눈금 4단·x라벨 최대 6개
  function frame(W, H, P, ymax, rows, yfmt) {
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}` });
    for (let i = 0; i <= 4; i++) {
      const y = P.t + ((H - P.t - P.b) * i) / 4;
      svg.appendChild(el('line', {
        x1: P.l, x2: W - P.r, y1: y, y2: y,
        stroke: i === 4 ? css('--baseline') : css('--grid'), 'stroke-width': 1,
      }));
      const t = el('text', { x: P.l - 8, y: y + 4, 'text-anchor': 'end', class: 'tick' });
      t.textContent = yfmt(ymax - (ymax * i) / 4);
      svg.appendChild(t);
    }
    const step = Math.ceil(rows.length / 6);
    rows.forEach((r, i) => {
      if (i % step !== 0 && i !== rows.length - 1) return;
      const x = P.l + ((W - P.l - P.r) * (i + 0.5)) / rows.length;
      const t = el('text', { x, y: H - P.b + 18, 'text-anchor': 'middle', class: 'tick' });
      t.textContent = md(r.date);
      svg.appendChild(t);
    });
    return svg;
  }

  // 카드 실제 폭 기준으로 그리기 — SVG가 비율 확대되지 않아 카드 높이가 일정하다 (리사이즈 시 재렌더)
  const boxW = (id) => Math.max(document.getElementById(id).clientWidth || 560, 320);

  // ── 일별 발송량 (막대) ──
  function renderBars(rows) {
    const W = boxW('barChart'), H = 250, P = { l: 52, r: 14, t: 12, b: 30 };
    const ymax = niceMax(Math.max(...rows.map((r) => r.sent)));
    const svg = frame(W, H, P, ymax, rows, (v) => (v >= 1000 ? Math.round(v / 100) / 10 + 'k' : Math.round(v)));
    const bw = (W - P.l - P.r) / rows.length;
    const plotH = H - P.t - P.b;
    rows.forEach((r, i) => {
      const h = Math.max((r.sent / ymax) * plotH, 2);
      const x = P.l + bw * i + 1; // 막대 사이 2px 표면 간격
      const bar = el('rect', {
        x, y: P.t + plotH - h, width: Math.max(bw - 2, 1), height: h,
        rx: 4, fill: css('--s1'),
      });
      bar.setAttribute('clip-path', 'inset(0 0 -4px 0 round 4px 4px 0 0)'); // 데이터 끝만 둥글게
      svg.appendChild(bar);
      const hit = el('rect', { x: P.l + bw * i, y: P.t, width: bw, height: plotH, fill: 'transparent' });
      hit.addEventListener('mousemove', (e) => {
        bar.setAttribute('fill-opacity', '.8');
        showTip(e.clientX, e.clientY, `<div class="t">${md(r.date)}</div>` + tipRow(css('--s1'), '발송', fmt(r.sent)));
      });
      hit.addEventListener('mouseleave', () => { bar.removeAttribute('fill-opacity'); hideTip(); });
      svg.appendChild(hit);
    });
    const box = document.getElementById('barChart');
    box.innerHTML = '';
    box.appendChild(svg);
  }

  // ── 일별 오픈율·클릭률 (라인 + 영역 + 크로스헤어) ──
  function renderLines(rows) {
    const W = boxW('lineChart'), H = 250, P = { l: 52, r: 64, t: 12, b: 30 };
    const series = [
      { key: 'openRate', label: '오픈율', color: css('--s2') },
      { key: 'clickRate', label: '클릭률', color: css('--s3') },
    ];
    rows = rows.map((r) => ({
      ...r,
      openRate: r.sent ? (r.open / r.sent) * 100 : 0,
      clickRate: r.sent ? (r.click / r.sent) * 100 : 0,
    }));
    const ymax = niceMax(Math.max(...rows.map((r) => r.openRate)));
    const svg = frame(W, H, P, ymax, rows, (v) => Math.round(v) + '%');
    const X = (i) => P.l + ((W - P.l - P.r) * (i + 0.5)) / rows.length;
    const Y = (v) => P.t + (H - P.t - P.b) * (1 - v / ymax);
    for (const s of series) {
      const line = rows.map((r, i) => `${i ? 'L' : 'M'}${X(i)},${Y(r[s.key])}`).join('');
      svg.appendChild(el('path', {
        d: `${line}L${X(rows.length - 1)},${H - P.b}L${X(0)},${H - P.b}Z`,
        fill: areaFill(svg, s.color), stroke: 'none',
      }));
      svg.appendChild(el('path', { d: line, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
      // 라인 끝 직접 라벨 (잉크 텍스트 + 색상 점)
      const last = rows[rows.length - 1];
      svg.appendChild(el('circle', { cx: X(rows.length - 1), cy: Y(last[s.key]), r: 3, fill: s.color }));
      const t = el('text', { x: X(rows.length - 1) + 8, y: Y(last[s.key]) + 4, class: 'endlab' });
      t.textContent = s.label;
      svg.appendChild(t);
    }
    // 크로스헤어 + 마커 + 툴팁
    const cross = el('line', { y1: P.t, y2: H - P.b, stroke: css('--baseline'), 'stroke-width': 1, visibility: 'hidden' });
    svg.appendChild(cross);
    const dots = series.map((s) => {
      const c = el('circle', { r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden' });
      svg.appendChild(c);
      return c;
    });
    const hit = el('rect', { x: P.l, y: P.t, width: W - P.l - P.r, height: H - P.t - P.b, fill: 'transparent' });
    hit.addEventListener('mousemove', (e) => {
      const box = svg.getBoundingClientRect();
      const mx = ((e.clientX - box.left) / box.width) * W;
      const i = Math.max(0, Math.min(rows.length - 1, Math.floor(((mx - P.l) / (W - P.l - P.r)) * rows.length)));
      cross.setAttribute('x1', X(i));
      cross.setAttribute('x2', X(i));
      cross.setAttribute('visibility', 'visible');
      series.forEach((s, k) => {
        dots[k].setAttribute('cx', X(i));
        dots[k].setAttribute('cy', Y(rows[i][s.key]));
        dots[k].setAttribute('visibility', 'visible');
      });
      showTip(e.clientX, e.clientY,
        `<div class="t">${md(rows[i].date)}</div>` +
        series.map((s) => tipRow(s.color, s.label, pct(rows[i][s.key]))).join(''));
    });
    hit.addEventListener('mouseleave', () => {
      hideTip();
      cross.setAttribute('visibility', 'hidden');
      dots.forEach((d) => d.setAttribute('visibility', 'hidden'));
    });
    svg.appendChild(hit);
    const box = document.getElementById('lineChart');
    box.innerHTML = '';
    box.appendChild(svg);
  }

  // ── 저니별 수평 막대 ──
  function renderJourneyBars(js) {
    const rowH = 36, P = { l: 10, r: 70, t: 4, b: 4 }, W = boxW('jBars');
    const H = P.t + P.b + js.length * rowH;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}` });
    const max = niceMax(Math.max(...js.map((j) => j.sent)));
    const LW = 185;
    js.forEach((j, i) => {
      const y = P.t + i * rowH;
      const lab = el('text', { x: P.l, y: y + rowH / 2 + 4, fill: css('--ink-2') });
      lab.textContent = j.name.length > 15 ? j.name.slice(0, 14) + '…' : j.name;
      lab.style.fontSize = '12px';
      lab.style.fontWeight = '600';
      svg.appendChild(lab);
      const bw = Math.max(((W - LW - P.r - P.l) * j.sent) / max, 2);
      const bar = el('rect', { x: P.l + LW, y: y + 9, width: bw, height: rowH - 18, rx: 4, fill: css('--s1') });
      svg.appendChild(bar);
      const v = el('text', { x: P.l + LW + bw + 8, y: y + rowH / 2 + 4, class: 'tick' });
      v.textContent = fmt(j.sent);
      svg.appendChild(v);
      const hit = el('rect', { x: 0, y, width: W, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', (e) => {
        bar.setAttribute('fill-opacity', '.8');
        showTip(e.clientX, e.clientY,
          `<div class="t">${j.name}</div>` +
          tipRow(css('--s1'), '발송', fmt(j.sent)) +
          tipRow(css('--s2'), '오픈율', pct((j.open / j.sent) * 100)) +
          tipRow(css('--s3'), '클릭률', pct((j.click / j.sent) * 100)));
      });
      hit.addEventListener('mouseleave', () => { bar.removeAttribute('fill-opacity'); hideTip(); });
      svg.appendChild(hit);
    });
    const box = document.getElementById('jBars');
    box.innerHTML = '';
    box.appendChild(svg);
  }

  function renderJourneyTable(js) {
    const t = document.getElementById('jTable');
    t.innerHTML =
      `<thead><tr><th>저니</th><th><span class="sw" style="background:var(--s1)"></span>발송</th>` +
      `<th><span class="sw" style="background:var(--s2)"></span>오픈율</th>` +
      `<th><span class="sw" style="background:var(--s3)"></span>클릭률</th><th>바운스율</th></tr></thead>`;
    const tb = document.createElement('tbody');
    for (const j of js) {
      const tr = document.createElement('tr');
      [j.name, fmt(j.sent), pct((j.open / j.sent) * 100), pct((j.click / j.sent) * 100), pct((j.bounce / j.sent) * 100)]
        .forEach((c, i) => {
          const td = document.createElement('td');
          td.textContent = c;
          if (i === 0) td.title = j.name;
          tr.appendChild(td);
        });
      tb.appendChild(tr);
    }
    t.appendChild(tb);
  }

  // ── KPI 타일 (이전 동일 기간 대비 + 스파크라인) ──
  function renderTiles(rows, prev, nDays) {
    const sum = (a, k) => a.reduce((s, r) => s + r[k], 0);
    const cur = { sent: sum(rows, 'sent'), open: sum(rows, 'open'), click: sum(rows, 'click'), bounce: sum(rows, 'bounce') };
    const prv = { sent: sum(prev, 'sent'), open: sum(prev, 'open'), click: sum(prev, 'click'), bounce: sum(prev, 'bounce') };
    const rate = (o, k) => (o.sent ? (o[k] / o.sent) * 100 : 0);
    const defs = [
      { k: '발송수', v: fmt(cur.sent), cur: cur.sent, prv: prv.sent, goodUp: true,
        diff: (c, p) => (p ? `${Math.abs((c - p) / p * 100).toFixed(1)}%` : null) },
      { k: '오픈율', v: pct(rate(cur, 'open')), cur: rate(cur, 'open'), prv: rate(prv, 'open'), goodUp: true,
        diff: (c, p) => `${Math.abs(c - p).toFixed(1)}%p` },
      { k: '클릭률', v: pct(rate(cur, 'click')), cur: rate(cur, 'click'), prv: rate(prv, 'click'), goodUp: true,
        diff: (c, p) => `${Math.abs(c - p).toFixed(1)}%p` },
      { k: '바운스율', v: pct(rate(cur, 'bounce')), cur: rate(cur, 'bounce'), prv: rate(prv, 'bounce'), goodUp: false,
        diff: (c, p) => `${Math.abs(c - p).toFixed(1)}%p` },
    ];
    const box = document.getElementById('tiles');
    box.innerHTML = '';
    for (const d of defs) {
      const up = d.cur >= d.prv;
      const good = up === d.goodUp;
      const diff = prev.length ? d.diff(d.cur, d.prv) : null;
      const div = document.createElement('div');
      div.className = 'tile';
      div.innerHTML = `<div class="krow"><span class="k"></span><span class="delta"></span></div><div class="v"></div>`;
      div.querySelector('.k').textContent = d.k;
      div.querySelector('.v').textContent = d.v;
      const delta = div.querySelector('.delta');
      if (diff) {
        delta.className = `delta ${good ? 'up' : 'down'}`;
        delta.textContent = `${up ? '▲' : '▼'} ${diff}`;
        delta.title = `이전 ${nDays}일 대비`;
      } else {
        delta.className = 'delta none';
        delta.textContent = '—';
      }
      box.appendChild(div);
    }
  }

  // ── 인사이트 카드 ──
  function renderInsights() {
    const LV = {
      good:    { label: '기회', color: css('--st-good') },
      warning: { label: '주의', color: css('--st-warning') },
      serious: { label: '점검', color: css('--st-serious') },
    };
    const box = document.getElementById('insights');
    box.innerHTML = '';
    for (const ins of DATA.insights || []) {
      const lv = LV[ins.level] || LV.good;
      const div = document.createElement('div');
      div.className = 'ins';
      div.style.setProperty('--lv', lv.color);
      div.innerHTML = `<span class="lv">${lv.label}</span><h3></h3><p></p>`;
      div.querySelector('h3').textContent = ins.title;
      div.querySelector('p').textContent = ins.body;
      if (ins.action) {
        const a = document.createElement('div');
        a.className = 'act';
        a.innerHTML = `<span>💬 <span class="cmd"></span></span><span class="copy">클릭하여 복사</span>`;
        a.querySelector('.cmd').textContent = `"${ins.action}"`;
        a.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(ins.action);
            a.querySelector('.copy').textContent = '✓ 복사됨';
            setTimeout(() => (a.querySelector('.copy').textContent = '클릭하여 복사'), 1600);
          } catch { /* 클립보드 권한 없으면 무시 */ }
        });
        div.appendChild(a);
      }
      box.appendChild(div);
    }
  }

  // ── 기간 계산 (프리셋 N일 또는 직접 지정 범위) ──
  const dFrom = document.getElementById('dFrom');
  const dTo = document.getElementById('dTo');
  const rangeEl = document.getElementById('range');
  dFrom.min = dTo.min = daily[0].date;
  dFrom.max = dTo.max = daily[daily.length - 1].date;

  function currentRows() {
    if (period.mode === 'preset') {
      const rows = daily.slice(-period.days);
      return { rows, prev: daily.slice(-period.days * 2, -period.days) };
    }
    const i0 = Math.max(daily.findIndex((r) => r.date >= period.from), 0);
    let i1 = daily.length - 1;
    while (i1 > 0 && daily[i1].date > period.to) i1--;
    const rows = daily.slice(i0, i1 + 1);
    const prev = daily.slice(Math.max(i0 - rows.length, 0), i0);
    return { rows, prev: prev.length === rows.length ? prev : [] }; // 동일 길이 비교가 안 되면 증감 생략
  }

  // ── 기간 적용 + 전체 렌더 ──
  function render() {
    const { rows, prev } = currentRows();
    if (!rows.length) {
      document.getElementById('sub').textContent = '선택한 기간에 데이터가 없습니다';
      return;
    }
    const from = rows[0].date, to = rows[rows.length - 1].date;
    document.getElementById('sub').textContent = `${from} ~ ${to} · ${rows.length}일`;
    dFrom.value = from;
    dTo.value = to;
    renderTiles(rows, prev, rows.length);
    renderBars(rows);
    renderLines(rows);
    // 저니 합계는 표시 기간에 비례해 스케일 (샘플: journeys가 30일 합계 기준)
    const scale = rows.length / Math.min(30, daily.length);
    const js = (DATA.journeys || [])
      .map((j) => ({ ...j, sent: Math.round(j.sent * scale), open: Math.round(j.open * scale), click: Math.round(j.click * scale), bounce: Math.round(j.bounce * scale) }))
      .sort((a, b) => b.sent - a.sent);
    lastJourneys = js;
    lastRange = { from, to };
    renderJourneyBars(js);
    renderJourneyTable(js);
    renderInsights();
  }

  // ── 엑셀 내보내기 (저니별 성과, 현재 표시 기간 기준 — 서버가 서식 입힌 xlsx 생성) ──
  let lastJourneys = [];
  let lastRange = {};
  const xlsxBtn = document.getElementById('xlsxBtn');
  xlsxBtn.addEventListener('click', async () => {
    xlsxBtn.disabled = true;
    try {
      const r = await fetch('/api/journey-xlsx', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: lastRange.from, to: lastRange.to, journeys: lastJourneys }),
      });
      if (!r.ok) return;
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `저니별성과_${lastRange.from}_${lastRange.to}.xlsx`;
      a.click();
      URL.revokeObjectURL(a.href);
    } finally {
      xlsxBtn.disabled = false;
    }
  });

  // ── 다크모드 수동 토글 (localStorage 보존, 미설정 시 OS 설정 따름) ──
  const themeBtn = document.getElementById('themeBtn');
  const isDark = () => (document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches);
  const syncThemeBtn = () => (themeBtn.textContent = isDark() ? '☀' : '🌙');
  const saved = localStorage.getItem('dash.theme');
  if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  themeBtn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('dash.theme', next);
    syncThemeBtn();
    render(); // 차트 색은 렌더 시점에 CSS 변수를 읽으므로 다시 그린다
  });
  syncThemeBtn();

  document.getElementById('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    period = { mode: 'preset', days: +b.dataset.days };
    rangeEl.classList.remove('active');
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
    render();
  });
  const onRange = () => {
    if (!dFrom.value || !dTo.value || dFrom.value > dTo.value) return;
    period = { mode: 'custom', from: dFrom.value, to: dTo.value };
    rangeEl.classList.add('active');
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    render();
  };
  dFrom.addEventListener('change', onRange);
  dTo.addEventListener('change', onRange);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  let rzTimer;
  addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(render, 150); });
  render();
})();
</script>
</body>
</html>
